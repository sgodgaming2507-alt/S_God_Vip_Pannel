<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S_God_Vip_Pannel</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>S_God_Vip_Pannel</h1>
        <p>Welcome to your control panel</p>
        <button class="btn" onclick="alert('Feature 1 Activated!')">Activate Feature 1</button>
        <button class="btn" onclick="alert('Feature 2 Activated!')">Activate Feature 2</button>
    </div>

</body>
</html>
